# Optional: prebuilds the codespace image and publishes it to GitHub Container
# Registry (ghcr.io) so student codespaces start in about a minute instead of
# building from scratch. See "Faster startups" in the README.
name: Build codespace image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - "environment.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
